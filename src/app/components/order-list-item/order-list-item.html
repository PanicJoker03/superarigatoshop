<mat-card class="order-list-item" appearance="outlined">
    <mat-card-header>
      <p>{{ orderId }}</p>

        <mat-card-title class="title-order-date">{{ orderDate | date:'MMMM dd, yyyy' }}</mat-card-title>
        <mat-card-subtitle class="title-order-number">#{{orderNumber}}</mat-card-subtitle>
        <p class="order-item-total">Total {{ totalPrice | currency }}</p>
    </mat-card-header>
    <mat-card-content>
        <img 
            class="detail-thumbnail" 
            [style.width]="'7rem'" 
            [style.height]="'7rem'" 
            src="{{imageUrl}}" 
        alt="" /> 
        
        <div [ngClass]="orderFulfillmentCss(orderStatus)" class="order-item-information">
            <mat-chip-set>
                <mat-chip>{{ orderFulfillmentTraduction(orderStatus) }} <mat-icon matChipTrailingIcon>inventory_2</mat-icon> </mat-chip>
            </mat-chip-set>
            <p>{{ productSummary }}</p>
        </div>
        <div class="order-item-actions">
            <button mat-button class="btn-action-reorder">Reordenar</button>
            <button (click)="btnDetailsClick($event, orderId)" mat-button class="btn-action-details">Detalles</button>
        </div>
    </mat-card-content>
</mat-card>
