<mat-card class="shopy-card product-grid-item" appearance="outlined">
  <mat-card-content>
    <a 
      routerLink="/pages/product-detail"
      [queryParams]="{ id: productId }"
      >
      <img mat-card-image [src]="imageUrl" alt="{{ title }}" (click)="onClick()"/>
    </a>
    <h2><a routerLink="/pages/product-detail"
    [queryParams]="{ id: productId }"
    >{{ title }}</a></h2>
    <p>{{ price }}</p>
  </mat-card-content>
</mat-card>
