<div>
  <img class="futarigato-banner" src="img/mundial-banner.png">
</div>
<div class="home-page">
  <div class="product-grid">
  @for (product of products(); track product.id) {
      <app-product-grid-item
        [productId]="product.id"
        [imageUrl]="product.imageUrl"
        [title]="product.title"
        [price]="product.price">
      </app-product-grid-item>
  }
  </div>  
</div>
