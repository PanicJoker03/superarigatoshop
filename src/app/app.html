<style>
  @import url('https://fonts.googleapis.com/css2?family=Paytone+One&display=swap');
  :host {

    --gray-900: oklch(19.37% 0.006 300.98);
    --gray-700: oklch(36.98% 0.014 302.71);
    --gray-400: oklch(70.9% 0.015 304.04);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji",
      "Segoe UI Symbol";
    box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    display: block;
  }

  h1 {
    font-size: 3.125rem;
    color: var(--gray-900);
    font-weight: 500;
    line-height: 100%;
    letter-spacing: -0.125rem;
    margin: 0;
    font-family: "Inter Tight", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji",
      "Segoe UI Symbol";
  }

  p {
    margin: 0;
    color: var(--gray-700);
  }

  main {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 1rem;
    box-sizing: inherit;
    position: relative;
  }

  .content h1 {
    margin-top: 1.75rem;
  }

  .content p {
    margin-top: 1.5rem;
  }

  .pill-group svg {
    margin-inline-start: 0.25rem;
  }

  .social-links path {
    transition: fill 0.3s ease;
    fill: var(--gray-400);
  }

  .social-links a:hover svg path {
    fill: var(--gray-900);
  }

  @media screen and (max-width: 650px) {
    .content {
      flex-direction: column;
      width: max-content;
    }
  }
</style>
<app-header></app-header>

@if (isReady()){
  @if (deviceViewMode() == DeviceViewMode.Mobile) {
    <app-navigation-mobile (menuToggled)="sideNavToggle()" class="navigation-mobile"></app-navigation-mobile>
    <mat-sidenav-container class="sidenav-container">
      <mat-sidenav ElementSwap #sidenav
                   class="side-navigation"
                   mode="side"
                   [(opened)]="sidenavOpened"
                   (swipeLeft)="onSwapeLeftSideNav()"
                   (swipeRight)="onSwipeRightSideNav()"
      >
        <mat-list>
          <mat-list-item></mat-list-item>
          <mat-divider></mat-divider>
          <mat-list-item>
            <a class="navbar-item-link" routerLink="/" >Inicio</a>
          </mat-list-item>
          <mat-divider></mat-divider>
          <mat-list-item>
            <a class="navbar-item-link" routerLink="/" [queryParams]="{ collectionHandle: 'plush' }">Peluches</a>
          </mat-list-item>
          <div class="navbar-personalizados">
            <mat-divider></mat-divider>
            <mat-list-item>
              <a class="navbar-item-link" routerLink="/" >Personalizados</a>
            </mat-list-item>
          </div>
          <mat-divider></mat-divider>
          <mat-list-item>
            <a class="navbar-item-link" routerLink="/" [queryParams]="{ collectionHandle: 'cup-holder' }">Posavasos</a>
          </mat-list-item>
          <mat-divider></mat-divider>
          <mat-list-item>
            <a class="navbar-item-link" routerLink="/" [queryParams]="{ collectionHandle: 'tars' }">Tazas</a>
          </mat-list-item>
          <mat-divider></mat-divider>
          <mat-list-item>
            <a class="navbar-item-link" routerLink="/" [queryParams]="{ collectionHandle: 'mouse-pads' }">Mouse Pads</a>
          </mat-list-item>
          <mat-divider></mat-divider>
          <mat-list-item>
            <a class="navbar-item-link" routerLink="/" [queryParams]="{ collectionHandle: 'microfiber' }">Microfibras</a>
          </mat-list-item>
        </mat-list>
      </mat-sidenav>
      <mat-sidenav-content>
        <div class="page-body-wrapper">
          <router-outlet></router-outlet>
        </div>
      </mat-sidenav-content>
    </mat-sidenav-container>
  }
  @else if (deviceViewMode() == DeviceViewMode.Web) {
    <app-navigation [ngClass]="'navigation'" [class.show]="deviceViewMode() === DeviceViewMode.Web"></app-navigation>
    <div class="page-body-wrapper">
      <router-outlet></router-outlet>
    </div>
  }
}
